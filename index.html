<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PERILOKA | Teroka Nota</title><style>:root{font-family:Arial,sans-serif;color:#24304d;background:#f3f6ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#6053dc,#b357e6);color:white;padding:32px 18px;text-align:center}h1{margin:0;font-size:clamp(26px,5vw,44px)}header p{margin:10px auto 0;max-width:680px;line-height:1.5}.wrap{max-width:1100px;margin:auto;padding:24px 16px 60px}.info{background:#fff;border-radius:18px;padding:16px 20px;margin-bottom:22px;box-shadow:0 6px 20px #394a8512}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:white;border-radius:22px;overflow:hidden;box-shadow:0 7px 25px #394a851b;border:2px solid #e6e8fb}.art{height:175px;background:linear-gradient(135deg,#ffe9b7,#e9d7ff);display:flex;align-items:center;justify-content:center;position:relative}.art img{width:100%;height:100%;object-fit:cover}.placeholder{text-align:center;padding:14px;color:#5d5480}.placeholder .emoji{font-size:60px;display:block;margin-bottom:10px}.placeholder small{font-size:12px}.content{padding:18px}.num{font-size:12px;color:#7559bf;font-weight:bold;letter-spacing:1px}.content h2{font-size:19px;line-height:1.3;margin:9px 0 10px}.keyword{display:inline-block;background:#fff2cc;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:bold;margin-bottom:14px}.btn{border:0;border-radius:13px;background:#604bd9;color:white;font-size:15px;font-weight:bold;padding:13px 18px;cursor:pointer;width:100%}.btn:hover{background:#4835b7}.details{margin-top:14px;padding:14px;background:#f4f1ff;border-radius:14px;line-height:1.6;font-size:15px}.details p{margin:7px 0}.details strong{color:#4334a2}.footer{text-align:center;margin-top:30px;color:#5b6484;font-size:13px}@media(max-width:500px){.wrap{padding:18px 12px 50px}.art{height:190px}}</style></head><body><header><h1>🌈 PERILOKA</h1><p>Jelajah Dunia, Singkap Makna!<br><strong>TEROKA NOTA • 18 PERIBAHASA</strong></p></header><main class="wrap"><div class="info">📚 <strong>Jom belajar peribahasa!</strong> Lihat gambar situasi dan tekan <strong>Lihat Maksud</strong> untuk membaca maksud serta contoh ayat. Tiada soalan teka.</div><div class="grid" id="cards"></div><p class="footer">PERILOKA • Bahasa Melayu Tahun 4</p></main><script>
const data=[
['Bulat air kerana pembetung, bulat manusia kerana muafakat','Muafakat','Keputusan atau kejayaan dicapai melalui perbincangan dan kerjasama.','Murid-murid bermuafakat untuk menghias kelas bersama-sama.','🤝'],
['Bagai aur dengan tebing','Saling membantu','Hubungan saling membantu antara satu sama lain.','Sofia dan Amir bagai aur dengan tebing kerana saling membantu ketika belajar.','🌿'],
['Di mana bumi dipijak, di situ langit dijunjung','Menghormati adat','Kita hendaklah menghormati adat dan peraturan di tempat kita berada.','Sebagai murid baharu, Amir menghormati peraturan sekolahnya.','🏫'],
['Tak lapuk dek hujan, tak lekang dek panas','Warisan kekal','Sesuatu adat, budaya atau warisan yang tetap kekal sepanjang zaman.','Permainan congkak ialah warisan yang tak lapuk dek hujan, tak lekang dek panas.','🏡'],
['Mencegah lebih baik daripada mengubati','Langkah pencegahan','Lebih baik mengelakkan sesuatu masalah daripada mengatasinya setelah berlaku.','Kita membersihkan kawasan rumah kerana mencegah lebih baik daripada mengubati.','🦟'],
['Otak cair','Cepat memahami','Seseorang yang cerdik dan cepat memahami pelajaran.','Danish otak cair kerana dapat menyelesaikan soalan sukar dengan cepat.','🧠'],
['Gulung tikar','Tutup perniagaan','Terpaksa menutup perniagaan kerana mengalami kerugian.','Kedai Pak Ali terpaksa gulung tikar kerana mengalami kerugian.','🏪'],
['Ada hati','Keinginan','Mempunyai keinginan atau hasrat untuk melakukan sesuatu.','Amir ada hati untuk menyertai pertandingan bercerita.','🌟'],
['Bekas tangan','Hasil kerja sendiri','Hasil kerja tangan atau ciptaan seseorang.','Rumah mini itu merupakan bekas tangan Sofia.','🎨'],
['Ringan tulang','Rajin membantu','Rajin bekerja dan suka membantu orang lain.','Danish ringan tulang kerana membantu guru mengemas kelas tanpa disuruh.','🧹'],
['Air dicencang tidak akan putus','Ikatan keluarga','Hubungan kekeluargaan tetap erat walaupun berlaku perselisihan faham.','Amir dan adiknya berbaik semula kerana air dicencang tidak akan putus.','❤️'],
['Seperti katak di bawah tempurung','Pengetahuan terhad','Seseorang yang kurang pengetahuan tentang dunia luar.','Amir seperti katak di bawah tempurung kerana tidak mengetahui perkara di luar kampungnya.','🌍'],
['Bagai kacang lupakan kulit','Lupa jasa','Melupakan asal usul atau jasa orang yang pernah membantu setelah berjaya.','Amir bagai kacang lupakan kulit apabila tidak menghargai rakannya yang membantunya.','🌰'],
['Bagai mencurah air ke daun keladi','Nasihat diabaikan','Nasihat atau teguran yang tidak diendahkan dan tidak memberikan kesan.','Nasihat Sofia bagai mencurah air ke daun keladi kerana Amir masih membuang sampah.','💧'],
['Berat sama dipikul, ringan sama dijinjing','Berkongsi tanggungjawab','Bersama-sama menghadapi susah dan senang serta saling membantu.','Semua murid berat sama dipikul, ringan sama dijinjing ketika menyediakan sudut bacaan.','📚'],
['Bagai isi dengan kuku','Sangat akrab','Hubungan yang sangat rapat dan sukar dipisahkan.','Sofia dan Amir bagai isi dengan kuku kerana mereka sangat akrab.','💕'],
['Seperti anjing dengan kucing','Sering bergaduh','Dua orang yang selalu bergaduh atau tidak sehaluan.','Amir dan Danish seperti anjing dengan kucing kerana sering bertengkar.','🐱'],
['Buah tangan','Hadiah atau oleh-oleh','Hadiah atau oleh-oleh yang dibawa selepas melawat sesuatu tempat.','Sofia membawa buah tangan dari Sabah untuk sahabatnya.','🎁']
];
const grid=document.getElementById('cards');
data.forEach((d,i)=>{const n=String(i+1).padStart(2,'0');const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="art"><img src="images/situasi-${n}.jpg" alt="Ilustrasi situasi ${n}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="placeholder" style="display:none"><span class="emoji">${d[4]}</span><small>Letakkan gambar Canva di<br><b>images/situasi-${n}.jpg</b></small></div></div><div class="content"><span class="num">KAD ${n} / 18</span><h2>${d[0]}</h2><span class="keyword">🔑 ${d[1]}</span><button class="btn" type="button" aria-expanded="false" aria-controls="detail-${n}">📖 Lihat Maksud</button><section class="details" id="detail-${n}" hidden><p><strong>Maksud:</strong> ${d[2]}</p><p><strong>Contoh ayat:</strong> ${d[3]}</p></section></div>`;const b=el.querySelector('button'),s=el.querySelector('section');b.addEventListener('click',()=>{s.hidden=!s.hidden;b.setAttribute('aria-expanded',String(!s.hidden));b.textContent=s.hidden?'📖 Lihat Maksud':'🙈 Sembunyikan Maksud'});grid.appendChild(el)});
</script></body></html>
